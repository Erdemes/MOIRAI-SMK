<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13315C"/>
      <stop offset="1" stop-color="#0A1B33"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#D99A2B"/>
      <stop offset="1" stop-color="#F6D77E"/>
    </linearGradient>
    <symbol id="mark" viewBox="0 0 220 220">
      <!-- ucus yollari (test izleri), gozden yukari yelpaze -->
      <g fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M110,132 Q92,102 64,74"   stroke-width="2.3" opacity="0.5"/>
        <path d="M110,130 Q110,94 110,56"  stroke-width="2.5" opacity="0.6"/>
        <path d="M110,132 Q128,102 156,74" stroke-width="2.3" opacity="0.5"/>
      </g>
      <!-- test noktalari -->
      <g fill="currentColor" opacity="0.7">
        <circle cx="86" cy="96" r="2.3"/><circle cx="110" cy="92" r="2.3"/><circle cx="134" cy="96" r="2.3"/>
      </g>
      <!-- 3 ucak (supurme kanat ust gorunum), farkli yonlere -->
      <g fill="currentColor">
        <path transform="translate(62,68) rotate(-40) scale(0.78)"  d="M0,-20 L3.5,-7 L17,7 L14.5,11 L4,7.5 L5,17 L0,14 L-5,17 L-4,7.5 L-14.5,11 L-17,7 L-3.5,-7 Z"/>
        <path transform="translate(110,52) rotate(0) scale(0.94)"   d="M0,-20 L3.5,-7 L17,7 L14.5,11 L4,7.5 L5,17 L0,14 L-5,17 L-4,7.5 L-14.5,11 L-17,7 L-3.5,-7 Z"/>
        <path transform="translate(158,68) rotate(40) scale(0.78)"  d="M0,-20 L3.5,-7 L17,7 L14.5,11 L4,7.5 L5,17 L0,14 L-5,17 L-4,7.5 L-14.5,11 L-17,7 L-3.5,-7 Z"/>
      </g>
      <!-- goren goz = FPV marker: daire govde + yan kanatcik + ust dikme + goz bebegi -->
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.8">
        <circle cx="110" cy="150" r="14"/>
        <line x1="96"  y1="150" x2="76"  y2="150"/>
        <line x1="124" y1="150" x2="144" y2="150"/>
        <line x1="110" y1="136" x2="110" y2="125"/>
      </g>
      <circle cx="110" cy="150" r="4.6" fill="currentColor"/>
    </symbol>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#navy)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.45"/>
  <use href="#mark" x="76" y="70" width="360" height="360" color="#ECC24A"/>
</svg>
