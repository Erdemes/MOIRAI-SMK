name: Portable release (win-x64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (empty = the <Version> in Moirai.App.csproj)"
        required: false
        default: ""
      run_tests:
        description: "Run the full test suite before publishing"
        type: boolean
        default: true
      publish_release:
        description: "Also attach the zip to a GitHub Release tagged v<version>"
        type: boolean
        default: false

jobs:
  portable:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        if: ${{ inputs.run_tests }}
        run: dotnet test MOIRAI.Tests --nologo

      - name: Publish portable build
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:VERSION) { ./publish.ps1 -Version $env:VERSION } else { ./publish.ps1 }

      - name: Locate zip
        id: zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter 'MOIRAI-*-portable-win-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'portable zip not found' }
          $version = $zip.BaseName -replace '^MOIRAI-', '' -replace '-portable-win-x64$', ''
          "name=$($zip.BaseName)" >> $env:GITHUB_OUTPUT
          "path=$($zip.Name)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.zip.outputs.version }}
          ZIP: ${{ steps.zip.outputs.path }}
        run: |
          gh release view $env:TAG 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:ZIP --clobber
          } else {
            gh release create $env:TAG $env:ZIP `
              --target $env:GITHUB_SHA `
              --title "MOIRAI $($env:TAG.TrimStart('v'))" `
              --notes "Portable self-contained Windows x64 build (no .NET install required).`n`nExtract the zip and run Moirai.App.exe. If Windows tagged the download, right-click the zip > Properties > Unblock first.`n`nBuilt from ``$env:GITHUB_REF_NAME`` @ $env:GITHUB_SHA."
          }
          if ($LASTEXITCODE -ne 0) { throw 'release publish failed' }
